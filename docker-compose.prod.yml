# =============================================================================
# Virgin Fund - Production Docker Compose
# Production environment configuration
# =============================================================================

version: '3.8'

services:
  # ================================
  # Production Platform
  # ================================
  virgin-fund-platform:
    image: virgin-fund-platform:latest
    container_name: virgin-fund-platform-prod
    restart: unless-stopped

    # Production Networking
    ports:
      - "80:3000"
      - "443:3000"

    # Production Environment
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1

      # Production Features
      - NEXT_PUBLIC_USE_MOCK_API=false
      - NEXT_PUBLIC_ENABLE_PAPER_TRADING=true
      - NEXT_PUBLIC_ENABLE_LIVE_TRADING=true

      # Production Security
      - NEXT_PUBLIC_FORCE_HTTPS=true
      - NEXT_PUBLIC_ENABLE_CSP=true

    # Production Dependencies
    depends_on:
      - postgres
      - redis

    # Production Health Checks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    # Production Networks
    networks:
      - virgin-fund-network

  # ================================
  # PostgreSQL Database
  # ================================
  postgres:
    image: postgres:15-alpine
    container_name: virgin-fund-postgres
    restart: unless-stopped

    # PostgreSQL Environment
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-virgin_fund}
      - POSTGRES_USER=${POSTGRES_USER:-virgin_fund_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

    # PostgreSQL Volumes
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

    # PostgreSQL Networking
    ports:
      - "5432:5432"

    # PostgreSQL Health Checks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

    # PostgreSQL Networks
    networks:
      - virgin-fund-network

  # ================================
  # Redis Cache
  # ================================
  redis:
    image: redis:7-alpine
    container_name: virgin-fund-redis
    restart: unless-stopped

    # Redis Configuration
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

    # Redis Volumes
    volumes:
      - redis_data:/data

    # Redis Networking
    ports:
      - "6379:6379"

    # Redis Health Checks
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

    # Redis Networks
    networks:
      - virgin-fund-network

  # ================================
  # Nginx Reverse Proxy
  # ================================
  nginx:
    image: nginx:alpine
    container_name: virgin-fund-nginx
    restart: unless-stopped

    # Nginx Configuration
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

    # Nginx Networking
    ports:
      - "80:80"
      - "443:443"

    # Nginx Dependencies
    depends_on:
      - virgin-fund-platform

    # Nginx Networks
    networks:
      - virgin-fund-network

# ================================
# Production Networks
# ================================
networks:
  virgin-fund-network:
    driver: bridge
    name: virgin-fund-network

# ================================
# Production Volumes
# ================================
volumes:
  postgres_data:
    driver: local
    name: virgin-fund-postgres-data
  redis_data:
    driver: local
    name: virgin-fund-redis-data
