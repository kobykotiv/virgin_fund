# =============================================================================
# Virgin Fund - Development Docker Compose Override
# Development environment configuration
# =============================================================================

version: '3.8'

services:
  # ================================
  # Development Platform
  # ================================
  virgin-fund-platform:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: virgin-fund-platform-dev

    # Development Networking
    ports:
      - "3000:3000"
      - "9229:9229"  # Node.js debugger

    # Development Environment
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - CHOKIDAR_USEPOLLING=true

      # Development Features
      - NEXT_PUBLIC_USE_MOCK_API=true
      - NEXT_PUBLIC_ENABLE_PAPER_TRADING=true
      - NEXT_PUBLIC_ENABLE_LIVE_TRADING=false

      # Development Debugging
      - DEBUG=*
      - NODE_OPTIONS=--inspect=0.0.0.0:9229

    # Development Volumes
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

    # Development Commands
    command: ["npm", "run", "dev"]

    # Development Dependencies
    depends_on:
      - postgres
      - redis

  # ================================
  # Supabase Local Development
  # ================================
  supabase:
    image: supabase/supabase:latest
    container_name: virgin-fund-supabase
    restart: unless-stopped

    # Supabase Environment
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password}
      - JWT_SECRET=${JWT_SECRET}
      - ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

    # Supabase Volumes
    volumes:
      - ./supabase/config.toml:/etc/supabase/config.toml
      - ./supabase/migrations:/etc/supabase/migrations
      - supabase_data:/var/lib/postgresql/data

    # Supabase Networking
    ports:
      - "54321:54321"  # API
      - "54322:54322"  # Database
      - "54323:54323"  # Studio
      - "54324:54324"  # Inbucket (Email)

    # Supabase Health Checks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:54321/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    # Supabase Networks
    networks:
      - virgin-fund-network

# ================================
# Development Networks
# ================================
networks:
  virgin-fund-network:
    external: true

# ================================
# Development Volumes
# ================================
volumes:
  supabase_data:
    driver: local
    name: virgin-fund-supabase-data
