name: Deploy Supabase run-bots Function

on:
  push:
    branches:
      - primer
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install supabase CLI
        run: |
          npm i -g supabase

      - name: Authenticate supabase (using generated service key via secrets)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Deploy run-bots function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
        run: |
          supabase functions deploy run-bots --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --env "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" --env "ALPACA_KEY=${{ secrets.ALPACA_KEY }}" --env "ALPACA_SECRET=${{ secrets.ALPACA_SECRET }}"

      - name: Run unit tests
        run: |
          pnpm i --frozen-lockfile
          pnpm test
