name: CI Tests

on:
  pull_request:
    branches: [ primer ]
  push:
    branches: [ primer ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: pnpm i --frozen-lockfile
      - name: Run tests
        run: pnpm test
