name: CI

on:
  push:
    branches: [ main, develop, primer, tasty-taur ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1'

      - name: Cache Bun store and node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            ~/.cache/bun
            .bun
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb','package-lock.json','package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (bun)
        run: |
          bun install

      - name: Run linter
        run: |
          # check package.json for a lint script using Node, then run via bun
          if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.lint ? 0 : 1)"; then
            bun run lint
          else
            echo "No lint script found; skipping"
          fi

      - name: Run typecheck
        run: |
          if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.typecheck ? 0 : 1)"; then
            bun run typecheck
          else
            echo "No typecheck script found; skipping"
          fi

      - name: Run unit tests
        run: |
          if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.test ? 0 : 1)"; then
            bun run test -- --ci
          else
            echo "No test script found; skipping"
          fi

      - name: Build
        run: |
          if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.build ? 0 : 1)"; then
            bun run build
          else
            echo "No build script found; skipping"
          fi

      - name: Upload workspace cache for debug (optional)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-failure-debug
          path: |
            .
            node_modules/**
