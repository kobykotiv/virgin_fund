name: Apply DB Migrations

on:
  workflow_dispatch:
  push:
    branches:
      - primer

jobs:
  run-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run migration
        env:
          PG_CONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$PG_CONN" ]; then echo 'PG_CONN missing'; exit 1; fi
          psql "$PG_CONN" -v ON_ERROR_STOP=1 -f "./supabase/migrations/20250818_add_idempotency_fields.sql"

      - name: Verify migration
        env:
          PG_CONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$PG_CONN" -c "SELECT column_name,data_type FROM information_schema.columns WHERE table_name='idempotency_keys';"
