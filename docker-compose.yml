# =============================================================================
# Virgin Fund - PaaS Docker Compose
# Multi-environment container orchestration
# =============================================================================

version: '3.8'

services:
  # ================================
  # Platform Application
  # ================================
  virgin-fund-platform:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: virgin-fund-platform
    restart: unless-stopped

    # Platform Networking
    ports:
      - "3000:3000"
    expose:
      - "3000"

    # Platform Environment
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1

      # Supabase Configuration
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

      # Alpaca Trading API
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET}
      - ALPACA_API_PAPER=${ALPACA_API_PAPER:-true}
      - ALPACA_API_BASE_URL=${ALPACA_API_BASE_URL:-https://paper-api.alpaca.markets}

      # Platform Security
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_CREDENTIAL_ENCRYPTION_KEY=${NEXT_PUBLIC_CREDENTIAL_ENCRYPTION_KEY}

      # Platform Features
      - NEXT_PUBLIC_USE_MOCK_API=${NEXT_PUBLIC_USE_MOCK_API:-false}
      - NEXT_PUBLIC_ENABLE_PAPER_TRADING=${NEXT_PUBLIC_ENABLE_PAPER_TRADING:-true}
      - NEXT_PUBLIC_ENABLE_LIVE_TRADING=${NEXT_PUBLIC_ENABLE_LIVE_TRADING:-false}

      # Platform Performance
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-200}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}

      # Platform Monitoring
      - SENTRY_DSN=${SENTRY_DSN}
      - NEXT_PUBLIC_ANALYTICS_ID=${NEXT_PUBLIC_ANALYTICS_ID}

      # Platform Caching
      - REDIS_URL=${REDIS_URL}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}

    # Platform Health Checks
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Platform Dependencies
    depends_on:
      - redis
      - postgres

    # Platform Networks
    networks:
      - virgin-fund-network

    # Platform Resource Limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Platform Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ================================
  # Redis Cache Layer
  # ================================
  redis:
    image: redis:7-alpine
    container_name: virgin-fund-redis
    restart: unless-stopped

    # Redis Configuration
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

    # Redis Networking
    expose:
      - "6379"

    # Redis Health Checks
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

    # Redis Networks
    networks:
      - virgin-fund-network

    # Redis Resource Limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ================================
  # PostgreSQL Database (Development)
  # ================================
  postgres:
    image: postgres:15-alpine
    container_name: virgin-fund-postgres
    restart: unless-stopped

    # PostgreSQL Environment
    environment:
      - POSTGRES_DB=virgin_fund
      - POSTGRES_USER=virgin_fund_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_password}

    # PostgreSQL Volumes
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d

    # PostgreSQL Networking
    expose:
      - "5432"

    # PostgreSQL Health Checks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virgin_fund_user -d virgin_fund"]
      interval: 30s
      timeout: 10s
      retries: 3

    # PostgreSQL Networks
    networks:
      - virgin-fund-network

    # PostgreSQL Resource Limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

# ================================
# Networks
# ================================
networks:
  virgin-fund-network:
    driver: bridge
    name: virgin-fund-network

# ================================
# Volumes
# ================================
volumes:
  redis_data:
    driver: local
    name: virgin-fund-redis-data
  postgres_data:
    driver: local
    name: virgin-fund-postgres-data

# ================================
# Platform Configuration
# ================================
x-platform-config: &platform-config
  environment:
    - NODE_ENV=production
    - NEXT_TELEMETRY_DISABLED=1
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
