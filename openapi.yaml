openapi: 3.0.3
info:
  title: Virgin Fund API
  version: 1.0.0
  description: OpenAPI description for core server endpoints (bots, backtests, settings, webhooks, liquidations). Use Supabase service role Bearer token for server-to-server calls.
servers:
  - url: https://{host}
    variables:
      host:
        default: localhost:3000
security:
  - ServiceBearer: []
components:
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AlpacaApiKey:
      type: apiKey
      in: header
      name: APCA-API-KEY-ID
  schemas:
    Bot:
      type: object
      properties:
        id:
          type: integer
          example: 42
        name:
          type: string
          example: "DCA BTC Monthly"
        symbol:
          type: string
          example: "BTCUSD"
        dca_amount:
          type: number
          example: 50
        enabled:
          type: boolean
          example: true
        stop_loss_pct:
          type: number
          example: 10
        liquidated:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
          example: "2025-08-01T12:00:00Z"
    Backtest:
      type: object
      properties:
        id:
          type: integer
          example: 11
        bot_id:
          type: integer
          example: 42
        results:
          type: object
          example: { "total_return": 0.12, "max_drawdown": 0.05 }
        created_at:
          type: string
          format: date-time
          example: "2025-08-17T09:00:00Z"
    OrderRecord:
      type: object
      properties:
        id:
          type: integer
          example: 1001
        bot_id:
          type: integer
          example: 42
        alpaca_order_id:
          type: string
          example: "a1b2c3"
        side:
          type: string
          example: "buy"
        qty:
          type: number
          example: 0.5
        price:
          type: number
          example: 27345.12
        status:
          type: string
          example: "filled"
        created_at:
          type: string
          format: date-time
          example: "2025-08-17T09:05:00Z"

paths:
  /api/bots:
    get:
      summary: List bots
      responses:
        '200':
          description: array of bots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bot'
              examples:
                sample:
                  value:
                    - id: 42
                      name: "DCA BTC Monthly"
                      symbol: "BTCUSD"
                      dca_amount: 50
                      enabled: true
    post:
      summary: Create a bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bot'
            examples:
              create:
                value:
                  name: "DCA EUR Weekly"
                  symbol: "EURUSD"
                  dca_amount: 100
                  enabled: true
      responses:
        '201':
          description: created bot
  /api/bots/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get bot by id
      responses:
        '200':
          description: bot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bot'
    patch:
      summary: Update bot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bot'
      responses:
        '200':
          description: updated
    delete:
      summary: Delete bot
      responses:
        '204':
          description: deleted

  /api/bots/{id}/execute:
    post:
      summary: Execute a bot (idempotent)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotency_key:
                  type: string
              example:
                idempotency_key: "manual-2025-08-17-42"
      responses:
        '200':
          description: execution result
          content:
            application/json:
              schema:
                type: object
              examples:
                success:
                  value:
                    ok: true
                    processed: 1
  /api/bots/{id}/backtest:
    post:
      summary: Run backtest for bot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date
                to:
                  type: string
                  format: date
              example:
                from: "2022-01-01"
                to: "2023-01-01"
      responses:
        '200':
          description: backtest results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backtest'

  /api/backtests/{id}:
    get:
      summary: Get backtest by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: backtest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backtest'

  /api/liquidate-all:
    post:
      summary: Liquidate all positions (admin)
      security:
        - ServiceBearer: []
      responses:
        '200':
          description: liquidation summary
          content:
            application/json:
              examples:
                sample:
                  value:
                    ok: true
                    liquidated: 5

  /api/webhooks/alpaca:
    post:
      summary: Alpaca order/position webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              sample:
                value:
                  stream: "trade_updates"
                  data:
                    event: "fill"
      responses:
        '200':
          description: accepted

  /api/settings:
    get:
      summary: Get global settings
      responses:
        '200':
          description: settings object
          content:
            application/json:
              schema:
                type: object
              examples:
                sample:
                  value:
                    global_dca_amount: 50
    patch:
      summary: Update global settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
            examples:
              update:
                value:
                  global_dca_amount: 75
      responses:
        '200':
          description: updated
