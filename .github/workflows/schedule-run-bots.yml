name: scheduled-run-bots

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 9 * * *' # daily at 09:00 UTC

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call Supabase run-bots function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          echo "Invoking run-bots function at $(date -u)"
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Missing required secrets: SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY" >&2
            exit 1
          fi

          # Call the Supabase Edge Function. The service role key is used only on the server side.
          HTTP_STATUS=$(curl -s -o /tmp/run-bots-response.json -w "%{http_code}" -X POST "${SUPABASE_URL%/}/functions/v1/run-bots" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' || true)

          echo "HTTP status: $HTTP_STATUS"
          echo "Response body:" && cat /tmp/run-bots-response.json || true

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "run-bots invoked successfully"
          else
            echo "run-bots invocation failed with status $HTTP_STATUS" >&2
            exit 1
          fi
